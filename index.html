<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedai 99 - Sistem POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ LOGIN PAGE ============ -->
<div id="loginPage" class="login-page" style="display:none;">
    <div class="login-card">
        <div class="logo">
            <h1><i class="fas fa-mug-hot"></i> KEDAI 99</h1>
            <p>Sistem Informasi Point of Sale</p>
        </div>
        <div id="loginError" class="alert alert-danger" style="display:none;"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="loginEmail" placeholder="email@kedai99.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">
                Admin: admin@kedai99.com / admin123<br>
                Kasir: rina@kedai99.com / kasir123
            </small>
        </div>
    </div>
</div>

<!-- ============ APP LAYOUT ============ -->
<div id="appLayout" class="app-layout" style="display:none;">

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-mug-hot"></i> KEDAI 99</h2>
            <small>Point of Sale System</small>
        </div>
        <div class="user-info">
            <div class="user-name" id="sidebarUserName"></div>
            <div class="user-role" id="sidebarUserRole"></div>
        </div>
        <div class="sidebar-nav" id="sidebarNav">
            <!-- Populated by app.js -->
        </div>
        <div class="sidebar-footer">
            <button class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                <i class="fas fa-sign-out-alt me-2"></i>Keluar
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="top-bar">
            <div class="d-flex align-items-center">
                <button class="btn btn-sm me-3 d-md-none" id="hamburgerBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span class="page-title" id="pageTitle">Dashboard</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted d-none d-sm-inline" style="font-size:13px;">
                    <i class="fas fa-user-circle me-1"></i>
                    <span id="topBarUser"></span>
                </span>
            </div>
        </div>
        <div class="content-area" id="contentArea">
            <!-- Views rendered here -->
        </div>
    </main>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- App Scripts -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/kasir-dashboard.js"></script>
<script src="js/menu.js"></script>
<script src="js/kategori.js"></script>
<script src="js/kasir.js"></script>
<script src="js/stok.js"></script>
<script src="js/transaksi.js"></script>
<script src="js/laporan.js"></script>
<script src="js/pos.js"></script>
<script src="js/app.js"></script>

</body>
</html>
